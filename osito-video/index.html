<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1E1834; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Nunito", sans-serif; }
      #grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 50; opacity: 0.22; mix-blend-mode: soft-light; pointer-events: none; }
      #vignette { position: absolute; inset: 0; z-index: 49; pointer-events: none;
        background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 58%, rgba(30,20,60,0.38) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="7.6" data-duration="8.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="15.6" data-duration="9.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="24.6" data-duration="12.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="36.6" data-duration="12.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="48.6" data-duration="11.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:6"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="60" data-track-index="5" data-layout-ignore></div>
      <img id="grain" class="clip" src="assets/grain.png" data-start="0" data-duration="60" data-track-index="6" data-layout-ignore alt="" />
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="60" data-track-index="7" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
