        const st = $("#c1-stack");

        [1889, 1902, 1929, 1949].forEach(y => { const t = document.createElement("div"); t.className = "c1-tick"; t.textContent = y; t.style.left = 160 + ((y - 1889) / 60) * 1600 + "px"; t.dataset.y = y; $("#c1-time").appendChild(t); });
      })();

      const tl = gsap.timeline({ paused: true });
      // ---- tarjeta de capítulo
      const tc = K.chapterCard(tl, "c1", 0.0, 1.55);
      // ---- Kioto (c1a): paneo con paralaje
      const a0 = 2.4, a1 = C.c1b[0];
      tl.set("#c1-kyoto", { opacity: 1 }, a0);
      tl.fromTo("#c1-far", { x: 0 }, { x: -160, duration: a1 - a0, ease: "none" }, a0);
      tl.fromTo("#c1-mid", { x: -100 }, { x: -420, duration: a1 - a0, ease: "none" }, a0);
      tl.fromTo("#c1-near", { x: 0 }, { x: -640, duration: a1 - a0, ease: "none" }, a0);
      tl.fromTo("#c1-sun", { y: 40 }, { y: 70, duration: a1 - a0, ease: "none" }, a0);
      tl.fromTo("#c1-m1", { x: 0 }, { x: 260, duration: a1 - a0, ease: "none" }, a0);
      tl.fromTo("#c1-m2", { x: 0 }, { x: -300, duration: a1 - a0, ease: "none" }, a0);
      K.blurIn(tl, "#c1-year", C.c1a[0] + 0.1, 0.6);
      K.blurIn(tl, "#c1-kyotoK", C.c1a[0] + 0.5, 0.6);
      // «Japón se abre al mundo a toda velocidad»: cruza el tren
      const tr = C.c1a[0] + 1.6;
      tl.set("#c1-train", { opacity: 1 }, tr);
      tl.fromTo("#c1-train", { x: -560 }, { x: 2000, duration: 5.4, ease: "power1.inOut" }, tr);
      ["#c1-p1", "#c1-p2", "#c1-p3"].forEach((p, i) => tl.fromTo(p, { attr: { r: 6 } }, { attr: { r: 14 + i * 8 }, duration: 0.9, repeat: 5, ease: "power1.out" }, tr + i * 0.15));
      tl.to(["#c1-year", "#c1-kyotoK"], { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, C.c1a[0] + 4.6);
      // «en sus calles aún se juega como hace siglos»: vista cenital de una partida
      const p0 = C.c1a[0] + 4.9;
      tl.set("#c1-play", { opacity: 1 }, p0);
      tl.fromTo("#c1-play", { scale: 1.08 }, { scale: 1.0, duration: a1 - p0, ease: "power2.out" }, p0);
      [["#c1-p-a", -1], ["#c1-p-b", 1], ["#c1-p-c", -1]].forEach(([s, dir], i) => tl.fromTo(s, { y: dir * 500, rotation: dir * 25, opacity: 0 }, { y: 0, rotation: (i - 1) * 6, opacity: 1, duration: 0.6, ease: "expo.out" }, p0 + 0.3 + i * 0.5));
      tl.set(["#c1-kyoto", "#c1-play"], { opacity: 0 }, a1);
      // ---- taller (c1b)
      tl.set("#c1-shop", { opacity: 1 }, a1);
      tl.fromTo("#c1-shop", { scale: 1.0 }, { scale: 1.07, transformOrigin: "40% 60%", duration: C.c1c[0] - a1, ease: "power1.inOut" }, a1);
      tl.fromTo("#c1-arm", { rotation: -4, transformOrigin: "330px 245px" }, { rotation: 5, duration: 0.55, repeat: 8, yoyo: true, ease: "sine.inOut" }, a1);
      tl.fromTo("#c1-brush", { rotation: -4, transformOrigin: "330px 245px" }, { rotation: 5, duration: 0.55, repeat: 8, yoyo: true, ease: "sine.inOut" }, a1);
      tl.fromTo("#c1-wpaint", { attr: { height: 0 } }, { attr: { height: 188 }, duration: 4.2, ease: "power1.inOut" }, a1 + 0.5);
      tl.set("#c1-fusa", { opacity: 1 }, C.c1b[0] + 1.7);
      K.wordsIn(tl, "#c1-fusa .n", C.c1b[0] + 1.7, { gap: 0.1 });
      K.blurIn(tl, "#c1-fusa .d", C.c1b[0] + 2.2, 0.4);
      tl.set("#c1-shop", { opacity: 0 }, C.c1c[0] - 0.05);
      // ---- 12 meses (c1c): reparto de 48 cartas
      const g0 = C.c1c[0] - 0.05;
      tl.set("#c1-grid", { opacity: 1 }, g0);
      tl.fromTo("#c1-count", { opacity: 0 }, { opacity: 1, duration: 0.3 }, g0 + 0.1);
      K.$$("#c1-grid .c1-colh").forEach((h, i) => tl.fromTo(h, { opacity: 0 }, { opacity: 1, duration: 0.2 }, g0 + 0.2 + i * 0.12));
      K.$$("#c1-grid .c1-g").forEach((c, i) => {
        const col = Math.floor(i / 4), row = i % 4, t = g0 + 0.9 + col * 0.2 + row * 0.07;
        tl.fromTo(c, { opacity: 0, y: -260 - row * 30, rotation: (col % 2 ? 1 : -1) * 18 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "expo.out" }, t);
      });
      K.count(tl, "#c1-n48", 0, 48, g0 + 0.9, 2.9);
      tl.to("#c1-grid", { opacity: 0, duration: 0.25 }, C.c1d[0] - 0.4);
      // ---- Nintendo Koppai (c1d)
      tl.set("#c1-sign", { opacity: 1 }, C.c1d[0] - 0.1);
      tl.fromTo("#c1-board", { y: -900, rotation: -4 }, { y: 0, rotation: 0, duration: 0.9, ease: "expo.out" }, C.c1d[0] - 0.1);
      tl.fromTo("#c1-rope", { y: -900 }, { y: 0, duration: 0.9, ease: "expo.out" }, C.c1d[0] - 0.1);
      tl.to("#c1-board", { rotation: 1.2, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "50% 0%" }, C.c1d[0] + 0.8);
      tl.set("#c1-signlbl", { opacity: 1 }, C.c1d[0] + 0.6);
      K.wordsIn(tl, "#c1-signlbl .a", C.c1d[0] + 0.6);
      K.blurIn(tl, "#c1-signlbl .b", C.c1d[0] + 1.0, 0.4);
      tl.set("#c1-sign", { opacity: 0 }, C.c1e[0] - 0.05);
      // ---- 任 天 堂 (c1e)
      tl.set("#c1-kan", { opacity: 1 }, C.c1e[0] - 0.05);
      ["#c1-k1", "#c1-k2", "#c1-k3"].forEach((k, i) => tl.fromTo(k, { opacity: 0, scale: 1.08, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, C.c1e[0] + 0.1 + i * 0.45));
      tl.to("#c1-k2 .g", { color: "#c23b22", duration: 0.4 }, C.c1e[0] + 2.2);
      K.wordsIn(tl, "#c1-kjline", C.c1e[0] + 1.6, { gap: 0.09 });
      K.blurIn(tl, "#c1-kjnote", C.c1e[0] + 2.1, 0.4);
      tl.to("#c1-kan", { opacity: 0, duration: 0.3 }, C.c1f[0] - 0.15);
      // ---- 1902 (c1f)
      const w0 = C.c1f[0] - 0.1;
      tl.set("#c1-west", { opacity: 1 }, w0);
      tl.fromTo("#c1-w5", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, w0);
      ["#c1-w1", "#c1-w2", "#c1-w3", "#c1-w4"].forEach((c, i) => tl.fromTo(c, { rotation: 0, opacity: 0, x: 300 }, { rotation: -24 + i * 16, opacity: 1, x: 40 + i * 30, duration: 0.8, ease: "expo.out" }, C.c1f[0] + 1.7 + i * 0.16));
      tl.to("#c1-w5", { x: -260, rotation: -14, duration: 0.8, ease: "expo.out" }, C.c1f[0] + 1.6);
      K.blurIn(tl, "#c1-wyear", C.c1f[0] + 1.5, 0.6);
      K.wordsIn(tl, "#c1-wtxt", C.c1f[0] + 2.8, { gap: 0.08 });
      tl.to("#c1-west", { opacity: 0, duration: 0.3 }, C.c1g[0] - 0.15);
      // ---- medio siglo (c1g) y 1949 (c1h)
      const m0 = C.c1g[0] - 0.1;
      tl.set("#c1-time", { opacity: 1 }, m0);
      tl.fromTo("#c1-axis", { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "power1.inOut" }, m0);
      K.$$("#c1-time .c1-tick").forEach(t => tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.3 }, m0 + ((+t.dataset.y - 1889) / 60) * 3.6));
      K.$$("#c1-stack .c1-sc").forEach((c, i) => tl.fromTo(c, { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" }, m0 + (i / 60) * 3.6));
      tl.set("#c1-yr", { opacity: 1 }, m0);
      K.count(tl, "#c1-yr", 1889, 1949, m0, 3.6, v => String(Math.round(v)));
      const y0 = C.c1h[0];
      tl.to("#c1-stack", { opacity: 0.25, duration: 0.4 }, y0);
      tl.fromTo("#c1-young", { opacity: 0, x: 300 }, { opacity: 1, x: 0, duration: 1.1, ease: "expo.out" }, y0 + 0.1);
      K.blurIn(tl, "#c1-22", y0 + 1.3, 0.5);
      K.blurIn(tl, "#c1-22s", y0 + 1.6, 0.4);
      // gota de tinta que lo cubre todo → capítulo 2
      tl.set("#c1-ink", { opacity: 1 }, D - 0.95);
      tl.fromTo("#c1-ink", { scale: 0 }, { scale: 120, duration: 0.9, ease: "power3.in" }, D - 0.95);
      window.__timelines["ch1"] = tl;
    })();
  </script>
</template>
