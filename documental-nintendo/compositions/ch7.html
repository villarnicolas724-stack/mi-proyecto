    #root { position: absolute; inset: 0; overflow: hidden; background: #17181c; color: #fff; font-family: "Montserrat", sans-serif; font-weight: 800; }
    .c7-full { position: absolute; inset: 0; opacity: 0; }
    /* tarjeta */
    .cc { position: absolute; inset: 0; opacity: 0; perspective: 1600px; z-index: 30; background: linear-gradient(90deg, #0ab9e6 0 50%, #ff3c28 50% 100%); }
    .cc-card { position: absolute; left: 520px; top: 270px; width: 320px; height: 534px; border-radius: 22px; background: #17181c; transform-style: preserve-3d; box-shadow: 0 30px 60px rgba(0,0,0,0.3); }
    .cc-card::before { content: ""; position: absolute; inset: 14px; border-radius: 12px; background: linear-gradient(90deg, #0ab9e6 0 50%, #ff3c28 50% 100%); }
    .cc-k { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Yuji Syuku", serif; font-size: 230px; color: #fff; }
    .cc-text { position: absolute; left: 930px; top: 380px; width: 900px; }
    .cc-num { font-size: 34px; letter-spacing: 0.14em; opacity: 0; }
    .cc-title { font-size: 104px; line-height: 1.0; margin-top: 12px; opacity: 0; font-weight: 900; }
    .cc-year { font-size: 60px; margin-top: 16px; color: #17181c; opacity: 0; }
    /* 3D */
    #c7-3d { background: radial-gradient(ellipse 80% 80% at 50% 45%, #2a2c33 0%, #17181c 70%); }
    #c7-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    .c7-lab { position: absolute; left: 130px; top: 120px; opacity: 0; }
    .c7-lab .d { font-size: 52px; color: #ff3c28; }
    .c7-lab .n { font-size: 108px; line-height: 1; font-weight: 900; margin-top: 6px; }
    .c7-lab .s { font-size: 36px; color: #b9bcc6; margin-top: 14px; font-weight: 700; }
    .c7-mode { position: absolute; right: 140px; top: 150px; font-size: 64px; font-weight: 900; text-align: right; opacity: 0; }
