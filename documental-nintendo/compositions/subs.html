<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    .sb { position: absolute; left: 0; right: 0; bottom: 112px; text-align: center; overflow: visible; }
    .sbt { display: inline-block; max-width: 1480px; padding: 9px 22px 11px; border-radius: 10px;
      background: rgba(14, 12, 12, 0.64); color: #fff; font-family: "Inter", sans-serif; font-weight: 600;
      font-size: 40px; line-height: 1.28; letter-spacing: 0.005em; text-wrap: balance; }
  </style>
  <div id="root" data-composition-id="subs" data-width="1920" data-height="1080" data-layout-allow-caption-zone>
    <div id="sb0" class="clip sb" data-start="1.55" data-duration="1.877" data-track-index="0"><span class="sbt">Esta carta se pintó a mano en</span></div>
    <div id="sb1" class="clip sb" data-start="3.307" data-duration="1.756" data-track-index="0"><span class="sbt">Kioto hace más de un siglo.</span></div>
    <div id="sb2" class="clip sb" data-start="5.543" data-duration="2.718" data-track-index="0"><span class="sbt">La empresa que la fabricó acabaría cambiando la</span></div>
    <div id="sb3" class="clip sb" data-start="8.141" data-duration="2.054" data-track-index="0"><span class="sbt">forma en que el mundo entero juega.</span></div>
    <div id="sb4" class="clip sb" data-start="11.075" data-duration="1.658" data-track-index="0"><span class="sbt">Su nombre es Nintendo.</span></div>
    <div id="sb5" class="clip sb" data-start="18.212" data-duration="4.142" data-track-index="0"><span class="sbt">Kioto, 1889. Japón se abre al mundo a toda velocidad,</span></div>
    <div id="sb6" class="clip sb" data-start="22.234" data-duration="3.839" data-track-index="0"><span class="sbt">pero en sus calles aún se juega como hace siglos.</span></div>
    <div id="sb7" class="clip sb" data-start="26.553" data-duration="2.747" data-track-index="0"><span class="sbt">En un pequeño taller del barrio de Shimogyō,</span></div>
    <div id="sb8" class="clip sb" data-start="29.18" data-duration="3.285" data-track-index="0"><span class="sbt">Fusajiro Yamauchi empieza a fabricar cartas hanafuda.</span></div>
    <div id="sb9" class="clip sb" data-start="32.695" data-duration="2.677" data-track-index="0"><span class="sbt">Barajas de flores: doce meses, cuarenta y</span></div>
    <div id="sb10" class="clip sb" data-start="35.252" data-duration="2.677" data-track-index="0"><span class="sbt">ocho cartas, pintadas a mano sobre papel.</span></div>
    <div id="sb11" class="clip sb" data-start="38.409" data-duration="2.561" data-track-index="0"><span class="sbt">El negocio se llama Nintendo Koppai.</span></div>
    <div id="sb12" class="clip sb" data-start="41.2" data-duration="2.366" data-track-index="0"><span class="sbt">Su nombre suele traducirse como «deja</span></div>
    <div id="sb13" class="clip sb" data-start="43.446" data-duration="1.941" data-track-index="0"><span class="sbt">la suerte en manos del cielo».</span></div>
    <div id="sb14" class="clip sb" data-start="45.867" data-duration="3.6" data-track-index="0"><span class="sbt">Las cartas triunfan, y en 1902 Nintendo fabrica las</span></div>
    <div id="sb15" class="clip sb" data-start="49.347" data-duration="3.804" data-track-index="0"><span class="sbt">primeras barajas de estilo occidental hechas en Japón.</span></div>
    <div id="sb16" class="clip sb" data-start="53.631" data-duration="4.297" data-track-index="0"><span class="sbt">Durante medio siglo, Nintendo será eso: un fabricante de cartas.</span></div>
    <div id="sb17" class="clip sb" data-start="58.158" data-duration="2.773" data-track-index="0"><span class="sbt">Hasta que llega un joven de veintidós años.</span></div>
    <div id="sb18" class="clip sb" data-start="64.911" data-duration="5.785" data-track-index="0"><span class="sbt">En 1949, Hiroshi Yamauchi, bisnieto del fundador, asume la presidencia.</span></div>
    <div id="sb19" class="clip sb" data-start="70.926" data-duration="3.045" data-track-index="0"><span class="sbt">Es exigente, ambicioso, y quiere que Nintendo sea</span></div>
    <div id="sb20" class="clip sb" data-start="73.851" data-duration="2.269" data-track-index="0"><span class="sbt">mucho más que una fábrica de naipes.</span></div>
    <div id="sb21" class="clip sb" data-start="76.6" data-duration="3.75" data-track-index="0"><span class="sbt">En 1959 firma con Disney: Mickey Mouse llega a las</span></div>
    <div id="sb22" class="clip sb" data-start="80.23" data-duration="4.041" data-track-index="0"><span class="sbt">barajas, y las cartas entran en los hogares con niños.</span></div>
    <div id="sb23" class="clip sb" data-start="84.751" data-duration="3.877" data-track-index="0"><span class="sbt">En 1963 la empresa pasa a llamarse Nintendo</span></div>
    <div id="sb24" class="clip sb" data-start="88.508" data-duration="3.352" data-track-index="0"><span class="sbt">Co., Ltd., y empieza a probarlo todo.</span></div>
    <div id="sb25" class="clip sb" data-start="92.09" data-duration="4.083" data-track-index="0"><span class="sbt">Una compañía de taxis. Arroz instantáneo. Casi nada funciona.</span></div>
    <div id="sb26" class="clip sb" data-start="96.653" data-duration="4.237" data-track-index="0"><span class="sbt">La respuesta llega desde donde nadie miraba: el taller de mantenimiento.</span></div>
    <div id="sb27" class="clip sb" data-start="101.12" data-duration="2.868" data-track-index="0"><span class="sbt">Allí trabaja Gunpei Yokoi, un ingeniero que se</span></div>
    <div id="sb28" class="clip sb" data-start="103.868" data-duration="3.167" data-track-index="0"><span class="sbt">ha fabricado un brazo extensible para entretenerse.</span></div>
    <div id="sb29" class="clip sb" data-start="107.265" data-duration="4.015" data-track-index="0"><span class="sbt">Yamauchi lo ve y le pide convertirlo en producto. En</span></div>
    <div id="sb30" class="clip sb" data-start="111.16" data-duration="3.64" data-track-index="0"><span class="sbt">1966 nace la Ultra Hand. Es un éxito inmediato.</span></div>
    <div id="sb31" class="clip sb" data-start="115.28" data-duration="3.42" data-track-index="0"><span class="sbt">Le siguen pistolas de luz, el Color TV-Game</span></div>
    <div id="sb32" class="clip sb" data-start="118.58" data-duration="2.346" data-track-index="0"><span class="sbt">y, en 1980, las Game &amp; Watch.</span></div>
    <div id="sb33" class="clip sb" data-start="121.156" data-duration="3.49" data-track-index="0"><span class="sbt">La filosofía de Yokoi marcará a Nintendo para siempre:</span></div>
    <div id="sb34" class="clip sb" data-start="124.526" data-duration="3.178" data-track-index="0"><span class="sbt">usar tecnología madura y barata de formas nuevas.</span></div>
    <div id="sb35" class="clip sb" data-start="131.484" data-duration="2.67" data-track-index="0"><span class="sbt">Los salones recreativos hipnotizan a medio</span></div>
    <div id="sb36" class="clip sb" data-start="134.034" data-duration="2.185" data-track-index="0"><span class="sbt">mundo, y Nintendo quiere su parte.</span></div>
    <div id="sb37" class="clip sb" data-start="136.449" data-duration="3.277" data-track-index="0"><span class="sbt">En 1980 abre una filial en Estados Unidos,</span></div>
    <div id="sb38" class="clip sb" data-start="139.606" data-duration="3.353" data-track-index="0"><span class="sbt">pero su gran apuesta, Radar Scope, fracasa.</span></div>
    <div id="sb39" class="clip sb" data-start="143.189" data-duration="3.443" data-track-index="0"><span class="sbt">Miles de máquinas se acumulan sin vender en un almacén.</span></div>
    <div id="sb40" class="clip sb" data-start="147.112" data-duration="2.756" data-track-index="0"><span class="sbt">Para salvarlas, Yamauchi encarga un juego nuevo</span></div>
    <div id="sb41" class="clip sb" data-start="149.748" data-duration="2.307" data-track-index="0"><span class="sbt">a un joven diseñador: Shigeru Miyamoto.</span></div>
    <div id="sb42" class="clip sb" data-start="152.285" data-duration="3.706" data-track-index="0"><span class="sbt">Miyamoto no piensa como un ingeniero. Piensa como un narrador.</span></div>
    <div id="sb43" class="clip sb" data-start="156.471" data-duration="1.878" data-track-index="0"><span class="sbt">Un gorila, una dama en apuros</span></div>
    <div id="sb44" class="clip sb" data-start="158.229" data-duration="2.241" data-track-index="0"><span class="sbt">y un carpintero que salta barriles.</span></div>
    <div id="sb45" class="clip sb" data-start="160.6" data-duration="2.734" data-track-index="0"><span class="sbt">Donkey Kong. 1981.</span></div>
    <div id="sb46" class="clip sb" data-start="163.814" data-duration="2.689" data-track-index="0"><span class="sbt">Aquel héroe se llamaba Jumpman. Muy pronto,</span></div>
    <div id="sb47" class="clip sb" data-start="166.383" data-duration="2.091" data-track-index="0"><span class="sbt">el mundo lo conocería como Mario.</span></div>
    <div id="sb48" class="clip sb" data-start="168.704" data-duration="2.736" data-track-index="0"><span class="sbt">Donkey Kong es un éxito enorme y pone el nombre</span></div>
    <div id="sb49" class="clip sb" data-start="171.32" data-duration="2.569" data-track-index="0"><span class="sbt">de Nintendo en los salones de todo el mundo.</span></div>
    <div id="sb50" class="clip sb" data-start="177.669" data-duration="3.242" data-track-index="0"><span class="sbt">El 15 de julio de 1983, Nintendo lanza</span></div>
    <div id="sb51" class="clip sb" data-start="180.791" data-duration="3.407" data-track-index="0"><span class="sbt">en Japón la Family Computer: la Famicom.</span></div>
    <div id="sb52" class="clip sb" data-start="184.678" data-duration="2.859" data-track-index="0"><span class="sbt">Ese mismo año, en Estados Unidos, el mercado</span></div>
    <div id="sb53" class="clip sb" data-start="187.417" data-duration="3.108" data-track-index="0"><span class="sbt">se hunde. Las tiendas ya no quieren videojuegos.</span></div>
    <div id="sb54" class="clip sb" data-start="191.005" data-duration="4.318" data-track-index="0"><span class="sbt">Nintendo llega en 1985 de todos modos: con un nombre nuevo,</span></div>
    <div id="sb55" class="clip sb" data-start="195.203" data-duration="3.678" data-track-index="0"><span class="sbt">NES, y con un robot para venderla como un juguete.</span></div>
    <div id="sb56" class="clip sb" data-start="199.111" data-duration="2.182" data-track-index="0"><span class="sbt">Y con un sello de calidad que promete</span></div>
    <div id="sb57" class="clip sb" data-start="201.173" data-duration="2.516" data-track-index="0"><span class="sbt">lo que el público había perdido: confianza.</span></div>
    <div id="sb58" class="clip sb" data-start="204.169" data-duration="2.669" data-track-index="0"><span class="sbt">Ese mismo año llega Super Mario Bros.</span></div>
    <div id="sb59" class="clip sb" data-start="207.068" data-duration="3.872" data-track-index="0"><span class="sbt">Un mundo que avanza contigo, secretos escondidos y un control</span></div>
    <div id="sb60" class="clip sb" data-start="210.82" data-duration="3.134" data-track-index="0"><span class="sbt">tan preciso que saltar se convierte en un placer.</span></div>
    <div id="sb61" class="clip sb" data-start="214.184" data-duration="3.288" data-track-index="0"><span class="sbt">Para muchos, define los juegos de plataformas durante</span></div>
    <div id="sb62" class="clip sb" data-start="217.352" data-duration="2.929" data-track-index="0"><span class="sbt">décadas. Mario se convierte en un icono global.</span></div>
    <div id="sb63" class="clip sb" data-start="220.761" data-duration="2.897" data-track-index="0"><span class="sbt">NES vende casi 62 millones de consolas</span></div>
    <div id="sb64" class="clip sb" data-start="223.538" data-duration="3.263" data-track-index="0"><span class="sbt">y devuelve la vida al videojuego doméstico.</span></div>
    <div id="sb65" class="clip sb" data-start="227.281" data-duration="2.602" data-track-index="0"><span class="sbt">En 1989, Gunpei Yokoi vuelve a</span></div>
    <div id="sb66" class="clip sb" data-start="229.763" data-duration="2.271" data-track-index="0"><span class="sbt">dar en el clavo: Game Boy.</span></div>
    <div id="sb67" class="clip sb" data-start="232.264" data-duration="3.256" data-track-index="0"><span class="sbt">Pilas que duran horas y Tetris en el bolsillo.</span></div>
    <div id="sb68" class="clip sb" data-start="235.4" data-duration="3.529" data-track-index="0"><span class="sbt">Con su sucesora en color, supera los 118 millones.</span></div>
    <div id="sb69" class="clip sb" data-start="239.409" data-duration="4.418" data-track-index="0"><span class="sbt">Y en 1990 llega Super Famicom, la Super Nintendo: dieciséis</span></div>
    <div id="sb70" class="clip sb" data-start="243.707" data-duration="3.835" data-track-index="0"><span class="sbt">bits, más color y una nueva generación de clásicos.</span></div>
    <div id="sb71" class="clip sb" data-start="251.322" data-duration="2.962" data-track-index="0"><span class="sbt">Pero Nintendo ya no está sola. SEGA y su Mega</span></div>
    <div id="sb72" class="clip sb" data-start="254.164" data-duration="3.026" data-track-index="0"><span class="sbt">Drive le plantan cara con un erizo muy rápido.</span></div>
    <div id="sb73" class="clip sb" data-start="257.42" data-duration="2.924" data-track-index="0"><span class="sbt">Y un acuerdo frustrado con Sony para un lector de</span></div>
    <div id="sb74" class="clip sb" data-start="260.224" data-duration="2.981" data-track-index="0"><span class="sbt">CD acaba dando vida a un nuevo rival: PlayStation.</span></div>
    <div id="sb75" class="clip sb" data-start="263.685" data-duration="3.99" data-track-index="0"><span class="sbt">En 1996, Nintendo responde con Nintendo 64 y</span></div>
    <div id="sb76" class="clip sb" data-start="267.555" data-duration="3.99" data-track-index="0"><span class="sbt">un mando con algo nuevo: un stick analógico.</span></div>
    <div id="sb77" class="clip sb" data-start="271.775" data-duration="2.414" data-track-index="0"><span class="sbt">Super Mario 64 enseña a toda una</span></div>
    <div id="sb78" class="clip sb" data-start="274.069" data-duration="2.987" data-track-index="0"><span class="sbt">industria a moverse en tres dimensiones.</span></div>
    <div id="sb79" class="clip sb" data-start="277.286" data-duration="3.504" data-track-index="0"><span class="sbt">Pero Nintendo apuesta por el cartucho cuando sus rivales</span></div>
    <div id="sb80" class="clip sb" data-start="280.67" data-duration="2.719" data-track-index="0"><span class="sbt">eligen el CD, y pierde terreno en el salón.</span></div>
    <div id="sb81" class="clip sb" data-start="283.869" data-duration="3.063" data-track-index="0"><span class="sbt">En el bolsillo, en cambio, ocurre algo inesperado.</span></div>
    <div id="sb82" class="clip sb" data-start="287.162" data-duration="3.48" data-track-index="0"><span class="sbt">En 1996, un juego de Game Boy propone atrapar</span></div>
    <div id="sb83" class="clip sb" data-start="290.522" data-duration="4.75" data-track-index="0"><span class="sbt">criaturas e intercambiarlas por cable con tus amigos: Pokémon.</span></div>
    <div id="sb84" class="clip sb" data-start="295.502" data-duration="2.317" data-track-index="0"><span class="sbt">Se convierte en un fenómeno mundial y en</span></div>
    <div id="sb85" class="clip sb" data-start="297.699" data-duration="3.141" data-track-index="0"><span class="sbt">una de las franquicias más grandes del entretenimiento.</span></div>
    <div id="sb86" class="clip sb" data-start="301.32" data-duration="3.952" data-track-index="0"><span class="sbt">En 2001 llegan Game Boy Advance y GameCube. La portátil</span></div>
    <div id="sb87" class="clip sb" data-start="305.152" data-duration="4.44" data-track-index="0"><span class="sbt">arrasa. GameCube, con 22 millones, queda lejos de sus rivales.</span></div>
    <div id="sb88" class="clip sb" data-start="310.072" data-duration="2.951" data-track-index="0"><span class="sbt">Nintendo saca una conclusión: no ganará jugando</span></div>
    <div id="sb89" class="clip sb" data-start="312.903" data-duration="1.867" data-track-index="0"><span class="sbt">al mismo juego que los demás.</span></div>
    <div id="sb90" class="clip sb" data-start="318.55" data-duration="3.351" data-track-index="0"><span class="sbt">En 2002, Satoru Iwata se convierte en presidente:</span></div>
    <div id="sb91" class="clip sb" data-start="321.781" data-duration="2.691" data-track-index="0"><span class="sbt">el primero ajeno a la familia Yamauchi.</span></div>
    <div id="sb92" class="clip sb" data-start="324.702" data-duration="2.684" data-track-index="0"><span class="sbt">Iwata es programador, y lo dice con orgullo:</span></div>
    <div id="sb93" class="clip sb" data-start="327.616" data-duration="2.452" data-track-index="0"><span class="sbt">«En mi tarjeta de visita soy presidente de</span></div>
    <div id="sb94" class="clip sb" data-start="329.948" data-duration="2.729" data-track-index="0"><span class="sbt">una empresa. En mi mente, soy un desarrollador.</span></div>
    <div id="sb95" class="clip sb" data-start="332.557" data-duration="2.118" data-track-index="0"><span class="sbt">Pero en mi corazón, soy un jugador.»</span></div>
    <div id="sb96" class="clip sb" data-start="335.155" data-duration="3.517" data-track-index="0"><span class="sbt">Su idea es sencilla y arriesgada: no competir en potencia,</span></div>
    <div id="sb97" class="clip sb" data-start="338.552" data-duration="3.048" data-track-index="0"><span class="sbt">sino invitar a jugar a quien nunca lo había hecho.</span></div>
    <div id="sb98" class="clip sb" data-start="342.08" data-duration="3.797" data-track-index="0"><span class="sbt">En 2004 llega Nintendo DS: dos pantallas, una táctil,</span></div>
    <div id="sb99" class="clip sb" data-start="345.757" data-duration="3.311" data-track-index="0"><span class="sbt">y un lápiz para jugar escribiendo y dibujando.</span></div>
    <div id="sb100" class="clip sb" data-start="349.298" data-duration="3.2" data-track-index="0"><span class="sbt">Entrenar la mente, cuidar de un perro…</span></div>
    <div id="sb101" class="clip sb" data-start="352.378" data-duration="2.47" data-track-index="0"><span class="sbt">DS vende más de 154 millones.</span></div>
    <div id="sb102" class="clip sb" data-start="355.328" data-duration="2.109" data-track-index="0"><span class="sbt">En 2006, Wii lo lleva al salón:</span></div>
    <div id="sb103" class="clip sb" data-start="357.317" data-duration="2.558" data-track-index="0"><span class="sbt">un mando que entiende tus movimientos.</span></div>
    <div id="sb104" class="clip sb" data-start="360.105" data-duration="3.53" data-track-index="0"><span class="sbt">Abuelos jugando a los bolos, familias enteras de pie frente</span></div>
    <div id="sb105" class="clip sb" data-start="363.515" data-duration="2.663" data-track-index="0"><span class="sbt">a la tele. Más de cien millones de consolas.</span></div>
    <div id="sb106" class="clip sb" data-start="366.658" data-duration="3.151" data-track-index="0"><span class="sbt">Después llegan 3DS, con imágenes en 3D</span></div>
    <div id="sb107" class="clip sb" data-start="369.689" data-duration="2.354" data-track-index="0"><span class="sbt">sin gafas, y en 2012, Wii U.</span></div>
    <div id="sb108" class="clip sb" data-start="372.273" data-duration="3.19" data-track-index="0"><span class="sbt">Wii U no se entiende bien. Con 13,56 millones,</span></div>
    <div id="sb109" class="clip sb" data-start="375.343" data-duration="3.123" data-track-index="0"><span class="sbt">es la sobremesa menos vendida de la compañía.</span></div>
    <div id="sb110" class="clip sb" data-start="378.946" data-duration="2.855" data-track-index="0"><span class="sbt">En 2015 llega el golpe más duro:</span></div>
    <div id="sb111" class="clip sb" data-start="381.681" data-duration="3.111" data-track-index="0"><span class="sbt">Satoru Iwata fallece a los 55 años.</span></div>
    <div id="sb112" class="clip sb" data-start="385.672" data-duration="2.116" data-track-index="0"><span class="sbt">Pero Wii U deja una idea en el aire:</span></div>
    <div id="sb113" class="clip sb" data-start="387.668" data-duration="2.448" data-track-index="0"><span class="sbt">jugar en la tele… y también lejos de ella.</span></div>
    <div id="sb114" class="clip sb" data-start="393.896" data-duration="3.623" data-track-index="0"><span class="sbt">El 3 de marzo de 2017 llega Nintendo Switch.</span></div>
    <div id="sb115" class="clip sb" data-start="397.749" data-duration="3.678" data-track-index="0"><span class="sbt">Una consola de sobremesa que se convierte en portátil en un</span></div>
    <div id="sb116" class="clip sb" data-start="401.307" data-duration="3.798" data-track-index="0"><span class="sbt">segundo. Separas los mandos y ya puedes compartir la partida.</span></div>
    <div id="sb117" class="clip sb" data-start="405.335" data-duration="2.989" data-track-index="0"><span class="sbt">Llega con Zelda: Breath of the Wild, una aventura de</span></div>
    <div id="sb118" class="clip sb" data-start="408.204" data-duration="2.934" data-track-index="0"><span class="sbt">mundo abierto que deja huella en toda la industria.</span></div>
    <div id="sb119" class="clip sb" data-start="411.618" data-duration="3.982" data-track-index="0"><span class="sbt">Mario Kart, Smash Bros., Animal Crossing… En 2020, durante el</span></div>
    <div id="sb120" class="clip sb" data-start="415.48" data-duration="4.235" data-track-index="0"><span class="sbt">confinamiento, millones de personas se reúnen en islas virtuales.</span></div>
    <div id="sb121" class="clip sb" data-start="420.195" data-duration="3.073" data-track-index="0"><span class="sbt">A finales de 2025, Switch supera a DS</span></div>
    <div id="sb122" class="clip sb" data-start="423.148" data-duration="3.312" data-track-index="0"><span class="sbt">y se convierte en la consola más vendida</span></div>
    <div id="sb123" class="clip sb" data-start="426.34" data-duration="3.152" data-track-index="0"><span class="sbt">de Nintendo: hoy, más de 157 millones.</span></div>
